<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Valentine Surprise</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            color: #c71585;
            padding-top: 50px;
            overflow-x: hidden;
            animation: heartbeat 3s infinite alternate;
        }

        /* Heartbeat background animation */
        @keyframes heartbeat {
            0% { background-color: #ffe6f0; }
            50% { background-color: #ffb6c1; }
            100% { background-color: #ffe6f0; }
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 30px;
            animation: glowPulse 2s infinite alternate;
        }

        /* Glowing sparkling text */
        @keyframes glowPulse {
            0% { text-shadow: 0 0 5px #ff69b4, 0 0 10px #ff69b4; }
            50% { text-shadow: 0 0 15px #ff1493, 0 0 30px #ff69b4; }
            100% { text-shadow: 0 0 5px #ff69b4, 0 0 10px #ff69b4; }
        }

        button {
            font-size: 1.2em;
            padding: 15px 30px;
            margin: 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background-color: #ff69b4;
            color: white;
            transition: transform 0.2s, top 0.2s, left 0.2s;
            position: relative;
        }

        button:hover {
            transform: scale(1.1);
        }

        #yesContent, #noContent {
            display: none;
            margin-top: 30px;
        }

        img {
            max-width: 80%;
            border-radius: 15px;
            margin-top: 20px;
        }

        /* Confetti container */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: 0;
            pointer-events: none;
            opacity: 0.7;
            z-index: 9999;
            animation: fall 3s linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>Sempering, will you be my Valentine? 💖</h1>
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>

    <div id="yesContent">
        <h2>Yay! 💘 I love you!</h2>
        <img src="your-picture.jpg" alt="Us together">
        <audio id="romanticAudio" autoplay>
            <source src="romantic-music.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div id="noContent">
        <h2>Oh no! 😢 Maybe next time...</h2>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');

        // Make "No" button move when hovering
        noBtn.addEventListener('mouseover', () => {
            const x = Math.floor(Math.random() * 200) - 100;
            const y = Math.floor(Math.random() * 200) - 100;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        });

        // Yes button click
        yesBtn.addEventListener('click', () => {
            yesBtn.style.display = 'none';
            noBtn.style.display = 'none';
            document.getElementById('yesContent').style.display = 'block';
            createConfetti();
        });

        // No button click
        noBtn.addEventListener('click', () => {
            yesBtn.style.display = 'none';
            noBtn.style.display = 'none';
            document.getElementById('noContent').style.display = 'block';
        });

        // Confetti function
        function createConfetti() {
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 70%)`;
                confetti.style.animationDuration = 2 + Math.random() * 3 + 's';
                confetti.style.width = 5 + Math.random() * 10 + 'px';
                confetti.style.height = 5 + Math.random() * 10 + 'px';
                document.body.appendChild(confetti);
                setTimeout(() => { confetti.remove(); }, 5000);
            }
        }
    </script>
</body>
</html>
